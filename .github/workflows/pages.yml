name: Publier le séminaire

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Générer les pages
        run: node generer.mjs --base-path /seminaire
      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
